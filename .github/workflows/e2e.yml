# M1-I1 — End-to-end tests (Playwright) against a LOCAL Supabase in the runner.
# Real users are created with the local service role (Google can't be automated); nothing here
# touches staging and no secrets are needed.

name: E2E

on:
  pull_request:
    paths:
      - "apps/web/**"
      - "packages/**"
      - "supabase/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/e2e.yml"
  push:
    branches: [develop]
    paths:
      - "apps/web/**"
      - "packages/**"
      - "supabase/**"
      - "pnpm-lock.yaml"
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

env:
  SUPABASE_CLI_VERSION: 2.116.0 # keep in sync with db-migrations.yml and the local CLI
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  e2e:
    name: Playwright (local Supabase)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - uses: supabase/setup-cli@v1
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}
      # Only what the tests use: Postgres, Auth (GoTrue), PostgREST and the Kong gateway.
      # Skipping the rest saves minutes and avoids image pulls we don't need.
      - name: Start local Supabase
        run: supabase start -x realtime,storage-api,imgproxy,mailpit,postgres-meta,studio,edge-runtime,logflare,vector,supavisor

      - name: Install Chromium
        run: pnpm --filter @prepora/web exec playwright install --with-deps chromium

      # playwright.config.ts reads the local keys from `supabase status`, builds the app against
      # local Supabase and serves it on :3200.
      - name: Run Playwright
        run: pnpm --filter @prepora/web e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report
            apps/web/test-results
          retention-days: 7

      - if: always()
        run: supabase stop --no-backup
