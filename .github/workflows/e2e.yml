# M1-I1 — End-to-end tests (Playwright) against a LOCAL Supabase in the runner.
# Real users are created with the local service role (Google can't be automated); nothing here
# touches staging and no secrets are needed.

name: E2E

on:
  pull_request:
    paths:
      - "apps/web/**"
      - "packages/**"
      - "supabase/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/e2e.yml"
  push:
    branches: [develop]
    paths:
      - "apps/web/**"
      - "packages/**"
      - "supabase/**"
      - "pnpm-lock.yaml"
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

env:
  SUPABASE_CLI_VERSION: 2.116.0 # keep in sync with db-migrations.yml and the local CLI
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  e2e:
    name: Playwright (local Supabase)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # Supabase's fixed host ports (54320-54329, supabase/config.toml) sit inside Linux's default
      # ephemeral range (32768-60999). An outgoing connection (e.g. an image pull) can grab one
      # first: "failed to bind host port 0.0.0.0:54322/tcp: address already in use". Move the
      # ephemeral range above them before anything starts.
      - name: Keep Supabase ports out of the ephemeral range
        run: sudo sysctl -w net.ipv4.ip_local_port_range="60000 65535"
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - uses: supabase/setup-cli@v1
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}
      # r2-upload-url (M5-B1) only signs URLs (no network call), so placeholder R2 settings let
      # listening-backend.spec.ts check it end to end. Nothing is uploaded; these aren't secrets.
      - name: Placeholder R2 settings for the edge runtime
        run: |
          cat > supabase/functions/.env <<'ENV'
          R2_ACCOUNT_ID=e2e00000000000000000000000000000
          R2_ACCESS_KEY_ID=e2e-access-key
          R2_SECRET_ACCESS_KEY=e2e-secret-key
          R2_BUCKET=prepora-audio-e2e
          R2_PUBLIC_URL=https://audio.e2e.invalid
          ENV
      # Only what the tests use: Postgres, Auth (GoTrue), PostgREST, Storage (the M5-B3 image
      # bucket), the Kong gateway and the edge runtime, which serves supabase/functions
      # (credits-edge.spec.ts, M3-I1). Skipping the rest saves minutes and avoids image pulls.
      - name: Start local Supabase
        run: |
          args="-x realtime,imgproxy,mailpit,postgres-meta,studio,logflare,vector,supavisor"
          # One retry for transient Docker errors on the runner.
          supabase start $args || { echo "::warning::supabase start failed; retrying once"; supabase stop --no-backup || true; supabase start $args; }

      - name: Install Chromium
        run: pnpm --filter @prepora/web exec playwright install --with-deps chromium

      # playwright.config.ts reads the local keys from `supabase status`, builds the app against
      # local Supabase and serves it on :3200.
      - name: Run Playwright
        run: pnpm --filter @prepora/web e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report
            apps/web/test-results
          retention-days: 7

      - if: always()
        run: supabase stop --no-backup
