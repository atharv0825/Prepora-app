# M0-I1 — Unit tests (Vitest) for the whole monorepo, on every PR and every push to develop.
# Fast (~seconds), so no path filter: shared code affects every app.

name: Unit tests

on:
  pull_request:
  push:
    branches: [develop]
  workflow_dispatch:

concurrency:
  group: unit-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  vitest:
    name: Vitest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
