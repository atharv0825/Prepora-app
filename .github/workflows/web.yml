# M0-F1 — Student web app (apps/web): checks on PRs, deploy to Cloudflare staging on develop.
# Per-PR preview deploys come in M0-I1.
#
# Required GitHub setup:
#   Environment "staging" secrets:
#     CLOUDFLARE_API_TOKEN   (Cloudflare → My Profile → API Tokens → "Edit Cloudflare Workers" template)
#     CLOUDFLARE_ACCOUNT_ID

name: Web

on:
  pull_request:
    paths:
      - "apps/web/**"
      - "packages/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/web.yml"
  push:
    branches: [develop]
    paths:
      - "apps/web/**"
      - "packages/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
  workflow_dispatch:

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: 1
  # Public Supabase settings, inlined into the build (M0-F3). Set as repository VARIABLES
  # (Settings → Secrets and variables → Actions → Variables), not secrets: both are public.
  # If unset, the build still works and /status reports "not configured".
  NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
  NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}

jobs:
  check-and-build:
    name: Lint, type-check, build (OpenNext)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4 # version comes from "packageManager" in package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @prepora/web lint
      - run: pnpm --filter @prepora/web typecheck
      - run: pnpm --filter @prepora/ui typecheck
      - run: pnpm --filter @prepora/shared typecheck
      - run: pnpm --filter @prepora/web exec opennextjs-cloudflare build
      - uses: actions/upload-artifact@v4
        with:
          name: web-open-next
          path: apps/web/.open-next
          include-hidden-files: true
          retention-days: 3

  deploy-staging:
    name: Deploy to Cloudflare (staging)
    needs: check-and-build
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: staging
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: web-open-next
          path: apps/web/.open-next
      # Top-level wrangler.jsonc config = staging worker (prepora-web-staging).
      - run: pnpm --filter @prepora/web exec opennextjs-cloudflare deploy
