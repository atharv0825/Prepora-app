packages:
  - "apps/*"
  - "packages/*"

# pnpm only runs dependency install scripts that are listed here.
allowBuilds:
  esbuild: true         # platform binary (used by wrangler / OpenNext)
  workerd: true         # Cloudflare Workers runtime binary (local preview)
  sharp: false          # image optimisation is off on Cloudflare Workers
  unrs-resolver: false
  core-js: false        # postinstall only prints a donation message (via posthog-js)

